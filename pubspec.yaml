name: saqr_gym
description: SAQR GYM - نظام صقر للتمرين (نسخة Native)
publish_to: 'none'
version: 2.7.0+9

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  archive: ^3.6.1
  path_provider: ^2.1.3
  path: ^1.9.0
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.5
  google_fonts: ^6.2.1
  # دفعة 10 — الهيكلة: إدارة الحالة + قاعدة بيانات محلية حقيقية
  flutter_riverpod: ^2.5.1
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  # دفعة 9 — Daily Automation: إشعارات محلية حقيقية (تذكير + Quick-log)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.19.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0D0E"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
    - assets/brand/
